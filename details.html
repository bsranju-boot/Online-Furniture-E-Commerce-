<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Product Details</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="details-card" id="details-container"></div>

    <!-- Product Reviews Section -->
    <section class="reviews-section" style="margin-top: 60px;">
      <div class="section-header">
        <span class="gold-tag">Client Impressions</span>
        <h2 class="section-title" style="font-size: 28px;">Product Reviews</h2>
        <div id="reviews-summary" style="margin-top: 10px;"></div>
      </div>

      <!-- Add Review Form (Directly on product page, no login needed) -->
      <div class="checkout-box" id="review-form-box" style="max-width: 650px; margin: 0 auto 40px;">
        <h3 style="font-size: 18px; margin-bottom: 18px; color: var(--gold-light);">Share Your Impression</h3>
        <form id="product-review-form" onsubmit="postReview(event, parseInt(new URLSearchParams(window.location.search).get('id')))">
          <div class="form-group">
            <label for="reviewer-name">Your Name</label>
            <input type="text" id="reviewer-name" placeholder="e.g. Eleanor Vance" required>
          </div>
          <div class="form-group">
            <label for="review-rating">Rating (1 to 5 Stars)</label>
            <select id="review-rating" style="background:#1a1a1a;color:var(--text-main);padding:12px;border-radius:14px;border:1px solid var(--gold-border);width:100%;font-family:var(--font-body);">
              <option value="5">★★★★★ - 5 Stars (Exceptional)</option>
              <option value="4">★★★★☆ - 4 Stars (Very Good)</option>
              <option value="3">★★★☆☆ - 3 Stars (Good)</option>
              <option value="2">★★☆☆☆ - 2 Stars (Fair)</option>
              <option value="1">★☆☆☆☆ - 1 Star (Needs Improvement)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="review-comment">Review Comments</label>
            <textarea id="review-comment" rows="3" placeholder="Describe the quality, texture, and aesthetic in your space..." required></textarea>
          </div>
          <p id="review-form-error" class="error-msg"></p>
          <button type="submit" class="btn btn-full">Submit Review</button>
        </form>
      </div>

      <!-- Reviews Display List -->
      <div id="reviews-list" style="max-width: 750px; margin: 0 auto;"></div>
    </section>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
