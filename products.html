<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | All Furniture Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html" class="active">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="section-header">
      <span class="gold-tag">Bespoke Catalog</span>
      <h2 class="page-title">Curated Furniture Collections</h2>
      <p class="section-desc">Explore our signature statement pieces designed for sophisticated interiors.</p>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search luxury furniture by name..." onkeyup="filterProducts()">
      <div class="category-buttons">
        <button class="filter-btn active" onclick="setCategory('All')">All</button>
        <button class="filter-btn" onclick="setCategory('Sofa')">Sofa</button>
        <button class="filter-btn" onclick="setCategory('Bed')">Bed</button>
        <button class="filter-btn" onclick="setCategory('Chair')">Chair</button>
        <button class="filter-btn" onclick="setCategory('Table')">Table</button>
      </div>
    </div>

    <div class="product-grid" id="product-list"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
