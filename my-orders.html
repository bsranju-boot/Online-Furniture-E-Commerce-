<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | My Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
      <li id="nav-auth-item"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="section-header">
      <span class="gold-tag">Client History</span>
      <h2 class="page-title">My Orders</h2>
      <p class="section-desc">Review your past bespoke acquisitions and delivery details.</p>
    </div>

    <div id="orders-container" style="max-width: 800px; margin: 0 auto;">
      <p class="empty-msg">Loading your order history...</p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async function () {
      var container = document.getElementById("orders-container");
      var user = await getCurrentUser();
      if (!user) {
        container.innerHTML = '<div class="checkout-box" style="text-align: center;"><p class="empty-msg">Please log in to view your orders.</p><a href="login.html?redirect=my-orders.html" class="btn">Sign In</a></div>';
        return;
      }

      var orders = await getUserOrdersFromDB(user.id);
      if (!orders || !orders.length) {
        container.innerHTML = '<div class="checkout-box" style="text-align: center;"><p class="empty-msg">You have not placed any orders yet.</p><a href="products.html" class="btn">Explore Collections</a></div>';
        return;
      }

      var h = "";
      for (var i = 0; i < orders.length; i++) {
        var ord = orders[i];
        var dateStr = new Date(ord.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        h += '<div class="checkout-box order-history-card" style="margin-bottom: 25px; text-align: left;">';
        h += '<div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold-border); padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">';
        h += '<div><span class="gold-tag" style="font-size: 10px;">Order ID</span><h3 style="font-size: 16px; margin-top: 4px;">' + ord.id + '</h3></div>';
        h += '<div style="text-align: right;"><span style="font-size: 12px; color: var(--text-muted);">' + dateStr + '</span><p class="gold-text" style="font-size: 18px; margin-top: 4px;">$' + ord.total + '</p></div>';
        h += '</div>';

        h += '<div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.6;">';
        h += '<p><strong>Recipient:</strong> ' + ord.customer_name + ' (' + ord.phone + ')</p>';
        h += '<p><strong>Shipping Destination:</strong> ' + ord.address + '</p>';
        h += '</div>';

        if (ord.order_items && ord.order_items.length) {
          h += '<div class="order-items-list" style="border-top: 1px dashed rgba(201,162,39,0.2); padding-top: 12px;">';
          for (var j = 0; j < ord.order_items.length; j++) {
            var item = ord.order_items[j];
            h += '<div style="display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0;">';
            h += '<span>' + item.product_name + ' &times; ' + item.quantity + '</span>';
            h += '<span class="gold-text">$' + (item.price * item.quantity) + '</span>';
            h += '</div>';
          }
          h += '</div>';
        }
        h += '</div>';
      }
      container.innerHTML = h;
    });
  </script>
</body>
</html>
