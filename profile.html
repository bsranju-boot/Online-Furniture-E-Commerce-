<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Client Profile</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
      <li><a href="login.html" id="nav-auth">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="section-header">
      <span class="gold-tag">Bespoke Membership</span>
      <h2 class="page-title">Client Profile</h2>
      <p class="section-desc">Manage your shipping details and account preferences.</p>
    </div>

    <div class="checkout-box">
      <form id="profile-form" onsubmit="handleSaveProfile(event)">
        <div class="form-group">
          <label>Account Email</label>
          <input type="text" id="profile-email" readonly style="opacity: 0.7; cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label for="profile-name">Full Name</label>
          <input type="text" id="profile-name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="profile-phone">Phone Number (10 digits)</label>
          <input type="text" id="profile-phone" placeholder="e.g. 9876543210" maxlength="10" required>
        </div>

        <div class="form-group">
          <label for="profile-address">Delivery Address</label>
          <textarea id="profile-address" rows="4" placeholder="Enter residential or delivery address" required></textarea>
        </div>

        <p id="profile-error" class="error-msg"></p>
        <p id="profile-success" class="success-msg" style="display: none; color: #2ecc71; text-align: center; margin-bottom: 14px; font-weight: 500; font-size: 14px;">Profile details saved successfully! ✓</p>

        <button type="submit" id="profile-submit-btn" class="btn btn-full">Save Changes</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async function () {
      var user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html?next=profile.html";
        return;
      }
      document.getElementById("profile-email").value = user.email || "";

      var prof = await getProfile();
      if (prof) {
        document.getElementById("profile-name").value = prof.name || "";
        document.getElementById("profile-phone").value = prof.phone || "";
        document.getElementById("profile-address").value = prof.address || "";
      }
    });

    async function handleSaveProfile(e) {
      e.preventDefault();
      var err = document.getElementById("profile-error");
      var succ = document.getElementById("profile-success");
      var btn = document.getElementById("profile-submit-btn");

      err.textContent = "";
      succ.style.display = "none";

      var name = document.getElementById("profile-name").value.trim();
      var phone = document.getElementById("profile-phone").value.trim();
      var addr = document.getElementById("profile-address").value.trim();

      btn.disabled = true;
      btn.textContent = "Saving...";

      var res = await saveProfile(name, phone, addr);
      btn.disabled = false;
      btn.textContent = "Save Changes";

      if (res.success) {
        succ.style.display = "block";
      } else {
        err.textContent = res.error;
      }
    }
  </script>
</body>
</html>
