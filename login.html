<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Client Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
      <li id="nav-auth-item"><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="section-header">
      <span class="gold-tag">Client Access</span>
      <h2 class="page-title">Sign In</h2>
      <p class="section-desc">Access your orders and exclusive furniture collections.</p>
    </div>

    <div class="checkout-box">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <p id="auth-error" class="error-msg"></p>
        <button type="submit" class="btn btn-full">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        Don't have an account? <a href="signup.html" class="btn-link">Create Account</a>
      </p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      var pass = document.getElementById("login-pass").value.trim();
      var errEl = document.getElementById("auth-error");
      errEl.textContent = "";

      var res = await signInUser(email, pass);
      if (res.error) {
        errEl.textContent = res.error;
      } else {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect") || "index.html";
        window.location.href = redirect;
      }
    }
  </script>
</body>
</html>
