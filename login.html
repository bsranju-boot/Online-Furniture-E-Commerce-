<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="db.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">AURA<span>.</span></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collections</a></li>
      <li><a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
      <li><a href="login.html" id="nav-auth" class="active">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab-btn active" onclick="switchTab('login')">Login</button>
        <button id="tab-signup" class="auth-tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <p id="login-error" class="error-msg"></p>
        <button type="submit" class="btn btn-full">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" onsubmit="handleSignup(event)" style="display: none;">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
          <label for="signup-pass">Password (min 6 characters)</label>
          <input type="password" id="signup-pass" placeholder="••••••••" minlength="6" required>
        </div>
        <p id="signup-error" class="error-msg"></p>
        <button type="submit" class="btn btn-full">Create Account</button>
      </form>

      <!-- Demo Credentials -->
      <div class="demo-box">
        <p><strong>Demo Accounts:</strong></p>
        <p>Admin: <code>admin@aura.com</code> / <code>admin123</code></p>
        <p>Customer: <code>ranju@aura.com</code> / <code>ranju123</code></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AURA Luxury Furniture. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    function switchTab(tab) {
      var isLogin = tab === 'login';
      document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('form-signup').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);
      document.getElementById('login-error').textContent = '';
      document.getElementById('signup-error').textContent = '';
    }

    function getNextUrl() {
      var next = new URLSearchParams(window.location.search).get('next');
      return next ? next : 'index.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value.trim();
      var pass = document.getElementById('login-pass').value.trim();
      var err = document.getElementById('login-error');
      err.textContent = '';
      if (!email || !pass) { err.textContent = 'Please enter both email and password.'; return; }
      var res = login(email, pass);
      if (res.success) {
        window.location.href = getNextUrl();
      } else {
        err.textContent = res.error;
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      var name = document.getElementById('signup-name').value.trim();
      var email = document.getElementById('signup-email').value.trim();
      var pass = document.getElementById('signup-pass').value.trim();
      var err = document.getElementById('signup-error');
      err.textContent = '';
      if (!name || !email || !pass) { err.textContent = 'Please fill out all fields.'; return; }
      if (pass.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
      var res = signup(name, email, pass);
      if (res.success) {
        window.location.href = getNextUrl();
      } else {
        err.textContent = res.error;
      }
    }
  </script>
</body>
</html>
